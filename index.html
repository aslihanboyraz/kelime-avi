<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kelime Avı</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23070b14'/%3E%3Cpath d='M8 10h16M8 16h10M8 22h13' stroke='%233ee0c5' stroke-width='2'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=IBM+Plex+Mono:wght@600;700&family=IBM+Plex+Sans:wght@500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="sky" aria-hidden="true">
      <span class="grid"></span>
      <span class="orb orb-a"></span>
      <span class="orb orb-b"></span>
      <span class="scan"></span>
    </div>

    <main class="app">
      <header class="hero">
        <h1><span>Kelime</span> Avı</h1>
        <p class="tagline">Backend, arayüz, siber, mobil ve veri. Dört doğru kelimede seviye yükselir.</p>
      </header>

      <section class="panel">
        <div class="hud">
          <article class="chip">
            <span>Puan</span>
            <strong id="score">0</strong>
          </article>
          <article class="chip">
            <span>Seri</span>
            <strong id="streak">0</strong>
          </article>
          <article class="chip">
            <span>En iyi</span>
            <strong id="best">0</strong>
          </article>
          <article class="chip">
            <span>Seviye</span>
            <strong id="level">Temel</strong>
          </article>
        </div>
        <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>
        <p class="level-note" id="level-note">Temel · 0/4</p>

        <p class="clue" id="clue">İpucu</p>
        <div class="slots" id="slots" aria-label="Kurulan kelime"></div>
        <div class="tiles" id="tiles" aria-label="Karışık harfler"></div>
        <p class="status" id="status">Bir harfe bas, cevap sırasına eklensin.</p>

        <div class="tools">
          <button type="button" id="shuffle">Karıştır</button>
          <button type="button" id="hint">Debug</button>
          <button type="button" id="skip">Geç</button>
        </div>
      </section>

      <p class="signature">Aslıhan Boyraz</p>
    </main>

    <div class="fx" id="fx" aria-hidden="true"></div>
    <script src="js/app.js"></script>
  </body>
</html>
